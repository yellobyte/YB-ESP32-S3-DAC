; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; after changing the board via PlatformIO, be sure to perform a clean before building with the new board  
default_envs = release

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = yb_esp32s3_dac
monitor_encoding = UTF-8    ; default
monitor_filters = esp32_exception_decoder, direct    ;decodes crash exception and forward all data unchanged. Useful if data already contains ANSI escape codes (colors)
monitor_speed = 115200      ; default is 115200 baud
upload_speed = 921600
monitor_port = COM[3456789]
upload_port = COM[3456789]

; --- for boards with 16MB Flash ---
;board_build.arduino.partitions = default_16MB.csv
;board_upload.flash_size = 16MB
;board_upload.maximum_size = 16777216
; --- for boards with 8MB PSRAM (opi)
;board_build.arduino.memory_type = qio_opi
;board_build.psram_type = opi

lib_deps = 
  https://github.com/greiman/SdFat.git
	https://github.com/anp59/SdFatFS.git
	https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.4
	Adafruit BusIO
  Adafruit TLV320 I2S	
  TLV320DAC3101=file://D:\Projects\VSCode\ESP32\YB-ESP32-S3-DAC\TLV320DAC3101-Lib
  ;TLV320DAC3101

build_flags = 
  -DCONFIG_ARDUHAL_LOG_COLORS    
	-DCORE_DEBUG_LEVEL=3
  -DUSE_UTF8_LONG_NAMES=1		; default set since 2.2.3 
	-DSDFAT_FILE_TYPE=1			; FAT32 / File32
	-DUSE_SPI_ARRAY_TRANSFER=1     ; If USE_SPI_ARRAY_TRANSFER is one and the standard SPI library is use, the array transfer function, transfer(buf, count), will be used.
	-DDISABLE_FS_H_WARNING         ; new since SdFat-Version 2.2.3 (see SdFat.h)
  -DMONITOR_SPEED=${this.monitor_speed}
	;-D SR_48K

;****************************************************************************

[env:release]
build_flags =
	${env.build_flags}
; 0 no debug output, 1 errors, 2 warnings, 3 infos, 4 debug info, 5 verbose
  	-DCORE_DEBUG_LEVEL=3
  	;-Wall
  	;-Wextra
  	-Wunreachable-code
  	;-Wformat=2
  	;-Werror=unused-variable
  	-Werror=unused-but-set-variable
build_unflags =
  	${env.build_unflags}
lib_deps =
  	${env.lib_deps}

;****************************************************************************

[env:debug]
monitor_filters =
  	${env.monitor_filters}
;  debug
build_type = debug
debug_init_break = tbreak setup
;debug_init_break = break loop
;
;debug_tool = custom
debug_tool = esp-builtin  ; ESP32-S3
debug_server = ${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
  -fboard/esp32s3-builtin.cfg
debug_port = localhost:3333
build_flags =
  	${env.build_flags}
; 0 no debug output, 1 errors, 2 warnings, 3 infos, 4 debug info, 5 verbose,
  	-DCORE_DEBUG_LEVEL=3
  -D_DEBUG_
lib_deps =
  	${env.lib_deps}
